name: Docker Image Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate today’s date and commit hash
        id: gen_tags
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "COMMIT_HASH=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          push: true
          # Registry cache instead of GHA cache: layers that are already part of the
          # pushed image are not uploaded a second time, and GHCR uploads are much
          # faster than the GHA cache backend (that export took ~57s).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/django:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/django:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          target: production
          secrets: |
            "PYPI_PASSWORD=${{ secrets.PYPI_PASSWORD }}"
          build-args: |
            HOME=/backend
            COMMIT_HASH=${{ steps.gen_tags.outputs.SHORT_COMMIT_HASH }}
            GIT_BRANCH=${{ github.ref_name }}
            VITE_API_URL=ALIGXILO_API_URL
            VITE_WEBSITE_URL=ALIGXILO_WEBSITE_URL
            VITE_STRIPE_PUBLISHABLE_KEY=ALIGXILO_STRIPE_PUBLISHABLE_KEY
            VITE_OUT_DIR=/backend/apps/registration/static/vue
          tags: |
            ghcr.io/${{ github.repository }}/django:latest
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.DATE }}
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.COMMIT_HASH }}
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.SHORT_COMMIT_HASH }}

name: Docker Image Build and Push

on:
  push:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: uk
          POSTGRES_USER: uk
          POSTGRES_PASSWORD: uk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      CONFIG_PREFIX: UK_
      UK_SECRET_KEY: not-secret-only-for-tests
      UK_DATABASE_URL: postgres://uk@localhost:5432/uk
      UK_POSTGRES_PASSWORD: uk
      UK_MCP_ENABLED: "true"
      # wagtail-evente comes from the private index (prod group)
      UV_INDEX_PYPI_IKSO_USERNAME: ikso
      UV_INDEX_PYPI_IKSO_PASSWORD: ${{ secrets.PYPI_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group prod

      - name: Run tests
        run: >-
          uv run pytest
          --cov
          --cov-report=term
          --cov-report=html
          --cov-report=markdown-append:$GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-backend
          path: backend/htmlcov/

  # No `needs` between the two test jobs: GitHub runs them in parallel
  test-frontend:
    name: Test frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: uk-aligxilo

    steps:
      # Full checkout: the tests read the fixtures of backend/apps/devel/data
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: uk-aligxilo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: uk-aligxilo/coverage/

  build:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate today’s date and commit hash
        id: gen_tags
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "SHORT_COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "COMMIT_HASH=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/Containerfile
          push: true
          # Registry cache instead of GHA cache: layers that are already part of the
          # pushed image are not uploaded a second time, and GHCR uploads are much
          # faster than the GHA cache backend (that export took ~57s).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/django:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/django:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          target: production
          secrets: |
            "PYPI_PASSWORD=${{ secrets.PYPI_PASSWORD }}"
          build-args: |
            HOME=/backend
            COMMIT_HASH=${{ steps.gen_tags.outputs.SHORT_COMMIT_HASH }}
            GIT_BRANCH=${{ github.ref_name }}
            VITE_API_URL=ALIGXILO_API_URL
            VITE_WEBSITE_URL=ALIGXILO_WEBSITE_URL
            VITE_STRIPE_PUBLISHABLE_KEY=ALIGXILO_STRIPE_PUBLISHABLE_KEY
            VITE_OUT_DIR=/backend/apps/registration/static/vue
          tags: |
            ghcr.io/${{ github.repository }}/django:latest
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.DATE }}
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.COMMIT_HASH }}
            ghcr.io/${{ github.repository }}/django:${{ steps.gen_tags.outputs.SHORT_COMMIT_HASH }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions: {}

    steps:
      - name: Trigger Arcane redeploy
        # https://docker.ikso.net/settings/webhooks
        # https://github.com/edukado-interreto/uk-retejo/settings/secrets/actions
        env:
          WEBHOOK_URL: ${{ secrets.ARCANE_WEBHOOK_REDEPLOY_UK_RETEJO }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 30 \
            -X POST "$WEBHOOK_URL"

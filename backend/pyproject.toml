[project]
name = "uk-retejo"
version = "0.1.0"
description = "La retejo de UK"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "diskcache-oxide[django]>=0.4.7",
  "dj-database-url>=2.3.0",
  "django~=6.0.0",
  "django-extensions>=4.1",
  "django-pattern-library>=1.6",
  "django-vite>=3.1.0",
  "granian>=2.8.5",
  "psycopg[binary]>=3.2.6",
  "pypdfium2>=5.14.0",
  "python-slugify>=8.0.4",
  "sentry-sdk[django]>=2.54.0",
  "toml-decouple>=0.11.0",
  "wagtail>=8.0,<9",
  "wagtail-custom-code-editor>=1.0.7",
  "wagtailmenus>=4.0.5",
]

[dependency-groups]
dev = [
  "django-cors-headers>=4.9.0",
  "django-debug-toolbar>=6.2.0",
  "django-stubs[compatible-mypy]>=5.2.9",
  "faker>=40.4.0",
  "granian[reload]>=2.8.5",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "pytest-django>=4.14.0",
  "ruff>=0.15.7",
  # In dev, wagtail-evente comes from the symlink: its mcp extra is listed here
  "wagtail-mcp>=0.3.0",
]
prod = [
  "wagtail-evente[mcp]>=0.16",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["apps", "config"]
# Test modules share names across apps (test_blocks.py, test_views.py)
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["apps", "config"]
branch = true
omit = [
  "*/migrations/*",
  "*/test_*.py",
  # Evaluated once at startup, its branches depend on the environment
  "config/settings.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
skip_empty = true

[tool.ruff.lint]
ignore = ["E731", "RUF012", "SIM102"]  # lambda/def, Class mutable attr, combine if

[tool.ruff.lint.isort]
known-third-party = ["django", "wagtail"]

[tool.djangofmt]
indent-width = 2

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# wagtail-mcp is untyped
module = "evente.mcp.tools"
disable_error_code = ["untyped-decorator"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ty.rules]
# Wagtail blocks declare `class Meta:` without inheriting the parent’s Meta,
# which ty reports as an invalid override (false positive for this pattern)
incompatible-attribute-override = "ignore"

[tool.uv.sources]
wagtail-evente = { index = "pypi-ikso" }

[[tool.uv.index]]
name = "pypi-ikso"
url = "https://pypi.ikso.net/simple"
authenticate = "always"
explicit = true
